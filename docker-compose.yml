version: '3.8'

services:
  webrtc-server:
    build: .
    container_name: webrtc-minimal
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - SSL_CERT_PATH=${SSL_CERT_PATH:-cert.pem}
      - SSL_KEY_PATH=${SSL_KEY_PATH:-key.pem}
    restart: unless-stopped
