version: '3.8'

services:
  webrtc-server:
    build: .
    container_name: webrtc-minimal
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - PORT=${PORT:-3000}
      - SSL_CERT_PATH=${SSL_CERT_PATH:-cert.pem}
      - SSL_KEY_PATH=${SSL_KEY_PATH:-key.pem}
    restart: unless-stopped
