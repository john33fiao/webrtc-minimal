<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Server (Viewer)</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; background: #222; color: white; }
        /* 16:9 비율 유지를 위한 컨테이너 */
        #video-container {
            position: relative;
            width: 80%;
            max-width: 960px;
            aspect-ratio: 16 / 9;
            background: black;
            border: 2px solid #555;
            cursor: crosshair;
        }
        video { width: 100%; height: 100%; object-fit: contain; }
        #annotationCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }
        button { padding: 10px 20px; font-size: 16px; margin: 20px; cursor: pointer; }
        #statusBadge {
            margin-top: 8px;
            padding: 8px 12px;
            background: #333b58;
            border: 1px solid #4a74ff;
            border-radius: 6px;
            font-size: 14px;
            color: #d8e1ff;
        }
        #overlayMessage {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d8e1ff;
            background: rgba(0, 0, 0, 0.35);
            font-size: 18px;
            letter-spacing: 0.5px;
            text-align: center;
            pointer-events: none;
            z-index: 3;
        }
    </style>
</head>
<body>
    <h2>Server (Video Receiver)</h2>
    <div id="statusBadge">상태: 판서 대기 상태</div>
    <button id="btnRequestStart">촬영 시작 요청</button>

    <div id="video-container">
        <div id="overlayMessage">판서 대기 상태입니다.</div>
        <video id="remoteVideo" autoplay playsinline></video>
        <canvas id="annotationCanvas"></canvas>
    </div>

    <!-- <script src="/socket.io/socket.io.js"></script> -->
    <script src="socket.io.min.js"></script>
    <script>
        const socket = io();
        const remoteVideo = document.getElementById('remoteVideo');
        const videoContainer = document.getElementById('video-container');
        const annotationCanvas = document.getElementById('annotationCanvas');
        const annotationCtx = annotationCanvas.getContext('2d');
        const statusBadge = document.getElementById('statusBadge');
        const overlayMessage = document.getElementById('overlayMessage');
        let peerConnection;
        let isDrawing = false;
        let lastPoint = null;

        // 기본 상태: 판서 대기
        const state = {
            annotation: 'waiting', // waiting | active
        };

        function updateAnnotationState(nextState) {
            state.annotation = nextState;
            if (nextState === 'waiting') {
                statusBadge.textContent = '상태: 판서 대기 상태';
                overlayMessage.textContent = '판서 대기 상태입니다.';
                overlayMessage.style.display = 'flex';
            } else {
                statusBadge.textContent = '상태: 판서 진행 중';
                overlayMessage.style.display = 'none';
            }
        }

        updateAnnotationState('waiting');

        // WebRTC 설정 (Google 무료 STUN 서버 사용)
        const rtcConfig = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        };

        // 1. 촬영 시작 요청 버튼
        document.getElementById('btnRequestStart').addEventListener('click', () => {
            console.log("Requesting camera start...");
            socket.emit('request_start_camera');
        });

        function resizeAnnotationCanvas() {
            const rect = videoContainer.getBoundingClientRect();
            const devicePixelRatio = window.devicePixelRatio || 1;
            annotationCanvas.width = rect.width * devicePixelRatio;
            annotationCanvas.height = rect.height * devicePixelRatio;
            annotationCanvas.style.width = `${rect.width}px`;
            annotationCanvas.style.height = `${rect.height}px`;
            annotationCtx.setTransform(1, 0, 0, 1, 0, 0);
            annotationCtx.scale(devicePixelRatio, devicePixelRatio);
            annotationCtx.lineJoin = 'round';
            annotationCtx.lineCap = 'round';
            annotationCtx.strokeStyle = '#0000ff';
            annotationCtx.lineWidth = 3;
        }

        window.addEventListener('resize', resizeAnnotationCanvas);
        resizeAnnotationCanvas();

        // 2. 마우스 입력 (드래그/클릭) 좌표 전송
        // 영상 내부에서의 상대 좌표(0.0 ~ 1.0)로 변환하여 전송해야 해상도가 달라도 정확함
        videoContainer.addEventListener('mousedown', (e) => {
            startDrawing(e);
            sendCoordinates(e);
        });

        videoContainer.addEventListener('mousemove', (e) => {
            drawStroke(e);
        });

        videoContainer.addEventListener('mouseup', () => {
            endDrawing();
        });

        videoContainer.addEventListener('mouseleave', () => {
            endDrawing();
        });

        function sendCoordinates(e) {
            const rect = videoContainer.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width; // 0.0 ~ 1.0
            const y = (e.clientY - rect.top) / rect.height; // 0.0 ~ 1.0
            
            // 좌표 전송
            socket.emit('send_input_coordinates', { x: x.toFixed(4), y: y.toFixed(4) });
            console.log(`Sent Coords: ${x.toFixed(4)}, ${y.toFixed(4)}`);
        }

        function getCanvasPoint(event) {
            const rect = annotationCanvas.getBoundingClientRect();
            const scaleX = annotationCanvas.width / rect.width;
            const scaleY = annotationCanvas.height / rect.height;
            return {
                x: (event.clientX - rect.left) * scaleX,
                y: (event.clientY - rect.top) * scaleY,
            };
        }

        function startDrawing(event) {
            isDrawing = true;
            lastPoint = getCanvasPoint(event);
            annotationCtx.beginPath();
            annotationCtx.moveTo(lastPoint.x, lastPoint.y);
            updateAnnotationState('active');
        }

        function drawStroke(event) {
            if (!isDrawing) return;
            const point = getCanvasPoint(event);
            annotationCtx.lineTo(point.x, point.y);
            annotationCtx.stroke();
            lastPoint = point;
            sendCoordinates(event);
        }

        function endDrawing() {
            isDrawing = false;
            lastPoint = null;
            updateAnnotationState('waiting');
        }

        // 3. WebRTC Signaling 처리
        socket.on('offer', async (offer) => {
            createPeerConnection();
            await peerConnection.setRemoteDescription(offer);
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('answer', answer);
        });

        socket.on('ice-candidate', (candidate) => {
            if (peerConnection) {
                peerConnection.addIceCandidate(candidate);
            }
        });

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(rtcConfig);

            // 상대방의 영상 트랙 수신 시 비디오 태그에 연결
            peerConnection.ontrack = (event) => {
                remoteVideo.srcObject = event.streams[0];
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', event.candidate);
                }
            };
        }
    </script>
</body>
</html>
