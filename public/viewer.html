<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Server (Viewer)</title>
    <style>
        :root {
            --bg: #0b1021;
            --frame: #0f172a;
            --border: #1e293b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: white;
        }

        /* 16:9 비율을 유지하며 뷰포트 크기에 맞춰 레터/필러박스 처리 */
        #video-container {
            position: relative;
            width: min(100vw, calc(100vh * 16 / 9));
            height: min(100vh, calc(100vw * 9 / 16));
            background: var(--frame);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
            cursor: crosshair;
            overflow: hidden;
        }

        video, #renderCanvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: black;
        }

        #renderCanvas {
            display: block;
        }

        #annotationCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: auto;
            cursor: crosshair;
            touch-action: none;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div id="video-container">
        <canvas id="renderCanvas"></canvas>
        <video id="remoteVideo" autoplay playsinline hidden></video>
        <canvas id="annotationCanvas"></canvas>
    </div>

    <!-- <script src="/socket.io/socket.io.js"></script> -->
    <script src="socket.io.min.js"></script>
    <script>
        const socket = io();
        const remoteVideo = document.getElementById('remoteVideo');
        const renderCanvas = document.getElementById('renderCanvas');
        const videoContainer = document.getElementById('video-container');
        let peerConnection;
        let isDrawing = false;
        let lastNormalizedPoint = null;
        const viewerStrokeColor = '#0000FF';
        const TARGET_WIDTH = 1920;
        const TARGET_HEIGHT = 1080;
        const STROKE_LIFETIME_MS = 10_000;

        const strokes = [];
        const activeStrokes = new Map();

        const overlayCanvas = document.getElementById('annotationCanvas');
        const overlayCtx = overlayCanvas.getContext('2d');

        function resizeRenderCanvas() {
            const rect = videoContainer.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            renderCanvas.width = TARGET_WIDTH * dpr;
            renderCanvas.height = TARGET_HEIGHT * dpr;
            renderCanvas.style.width = `${rect.width}px`;
            renderCanvas.style.height = `${rect.height}px`;
            const ctx = renderCanvas.getContext('2d');
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
        }

        function resizeCanvas() {
            const rect = videoContainer.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            overlayCanvas.width = rect.width * dpr;
            overlayCanvas.height = rect.height * dpr;
            overlayCanvas.style.width = `${rect.width}px`;
            overlayCanvas.style.height = `${rect.height}px`;
            overlayCtx.strokeStyle = viewerStrokeColor;
            overlayCtx.lineWidth = 3;
            overlayCtx.lineCap = 'round';
            overlayCtx.lineJoin = 'round';
            overlayCtx.setTransform(1, 0, 0, 1, 0, 0);
            overlayCtx.scale(dpr, dpr);
            renderAllStrokes();
        }

        function getNormalizedCoords(event) {
            const rect = overlayCanvas.getBoundingClientRect();
            const x = (event.clientX - rect.left) / rect.width;
            const y = (event.clientY - rect.top) / rect.height;
            return {
                x: Number(x.toFixed(4)),
                y: Number(y.toFixed(4)),
            };
        }

        function drawPoint(point, ctx) {
            ctx.beginPath();
            ctx.arc(point.x, point.y, 2, 0, Math.PI * 2);
            ctx.fillStyle = ctx.strokeStyle;
            ctx.fill();
        }

        function appendToStroke(stroke, normalizedPoint, { isStart = false } = {}) {
            const canvasWidth = overlayCanvas.width;
            const canvasHeight = overlayCanvas.height;
            const toCanvasPoint = (p) => ({ x: p.x * canvasWidth, y: p.y * canvasHeight });

            overlayCtx.save();
            overlayCtx.strokeStyle = stroke.color;
            overlayCtx.fillStyle = stroke.color;
            overlayCtx.lineWidth = 3;
            overlayCtx.lineCap = 'round';
            overlayCtx.lineJoin = 'round';

            const totalPoints = stroke.points.length;
            const currentPoint = toCanvasPoint(normalizedPoint);

            if (totalPoints <= 1 || isStart) {
                drawPoint(currentPoint, overlayCtx);
                overlayCtx.restore();
                return;
            }

            const prevPoint = toCanvasPoint(stroke.points[totalPoints - 2]);
            overlayCtx.beginPath();
            overlayCtx.moveTo(prevPoint.x, prevPoint.y);
            overlayCtx.lineTo(currentPoint.x, currentPoint.y);
            overlayCtx.stroke();
            overlayCtx.restore();
        }

        function renderAllStrokes() {
            const canvasWidth = overlayCanvas.width;
            const canvasHeight = overlayCanvas.height;
            const toCanvasPoint = (p) => ({
                x: p.x * canvasWidth,
                y: p.y * canvasHeight,
            });

            overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            strokes.forEach((stroke) => {
                if (!stroke.points.length) return;
                overlayCtx.save();
                overlayCtx.strokeStyle = stroke.color;
                overlayCtx.fillStyle = stroke.color;
                overlayCtx.lineWidth = 3;
                overlayCtx.lineCap = 'round';
                overlayCtx.lineJoin = 'round';

                if (stroke.points.length === 1) {
                    drawPoint(toCanvasPoint(stroke.points[0]), overlayCtx);
                } else {
                    overlayCtx.beginPath();
                    const startPoint = toCanvasPoint(stroke.points[0]);
                    overlayCtx.moveTo(startPoint.x, startPoint.y);
                    for (let i = 1; i < stroke.points.length; i++) {
                        const canvasPoint = toCanvasPoint(stroke.points[i]);
                        overlayCtx.lineTo(canvasPoint.x, canvasPoint.y);
                    }
                    overlayCtx.stroke();
                }
                overlayCtx.restore();
            });
        }

        function scheduleStrokeExpiry(stroke) {
            if (stroke.expireTimer) clearTimeout(stroke.expireTimer);
            stroke.expireTimer = setTimeout(() => {
                const idx = strokes.indexOf(stroke);
                if (idx !== -1) {
                    strokes.splice(idx, 1);
                    renderAllStrokes();
                }
            }, STROKE_LIFETIME_MS);
        }

        function finalizeStroke(strokeKey) {
            const stroke = activeStrokes.get(strokeKey);
            if (!stroke) return;
            activeStrokes.delete(strokeKey);
            scheduleStrokeExpiry(stroke);
        }

        function upsertStroke(strokeKey, strokeColor, normalizedPoint, { isStart = false, isEnd = false } = {}) {
            if (isStart) {
                finalizeStroke(strokeKey);
            }

            let stroke = activeStrokes.get(strokeKey);
            if (!stroke || isStart) {
                stroke = { key: strokeKey, color: strokeColor, points: [], expireTimer: null };
                strokes.push(stroke);
                activeStrokes.set(strokeKey, stroke);
            }

            stroke.points.push(normalizedPoint);

            if (isEnd) {
                finalizeStroke(strokeKey);
            }

            appendToStroke(stroke, normalizedPoint, { isStart });
        }

        function sendAnnotationPoint(normalized, { isStart = false, isEnd = false } = {}) {
            const payload = {
                x: normalized.x,
                y: normalized.y,
                source: 'viewer',
                createdAt: Date.now(),
                kind: 'annotation-point',
                isStart,
                isEnd,
                color: viewerStrokeColor,
            };
            socket.emit('annotation:point', payload);
            console.log('[annotation] sent', payload);
        }

        resizeRenderCanvas();
        resizeCanvas();
        window.addEventListener('resize', () => {
            resizeRenderCanvas();
            resizeCanvas();
        });

        function renderRemoteVideo() {
            const ctx = renderCanvas.getContext('2d');
            const width = remoteVideo.videoWidth || TARGET_WIDTH;
            const height = remoteVideo.videoHeight || TARGET_HEIGHT;
            if (!width || !height) {
                requestAnimationFrame(renderRemoteVideo);
                return;
            }

            const scale = Math.min(TARGET_WIDTH / width, TARGET_HEIGHT / height);
            const drawWidth = width * scale;
            const drawHeight = height * scale;
            const offsetX = (TARGET_WIDTH - drawWidth) / 2;
            const offsetY = (TARGET_HEIGHT - drawHeight) / 2;

            ctx.clearRect(0, 0, TARGET_WIDTH, TARGET_HEIGHT);
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, TARGET_WIDTH, TARGET_HEIGHT);
            ctx.drawImage(remoteVideo, offsetX, offsetY, drawWidth, drawHeight);

            requestAnimationFrame(renderRemoteVideo);
        }

        function requestStartCamera() {
            console.log('Requesting camera start...');
            socket.emit('request_start_camera');
        }

        // WebRTC 설정: 로컬망 환경만 사용하므로 외부 STUN 서버 없이 구성
        const rtcConfig = {
            iceServers: []
        };

        // 1. 영상 영역 클릭 시 촬영 시작 요청
        videoContainer.addEventListener('click', requestStartCamera, { capture: true });

        // 2. 마우스 입력 (드래그/클릭) 좌표 전송 및 로컬 렌더링
        // 영상 내부에서의 상대 좌표(0.0 ~ 1.0)로 변환하여 전송해야 해상도가 달라도 정확함
        overlayCanvas.addEventListener('mousedown', (e) => {
            requestStartCamera();
            const normalized = getNormalizedCoords(e);
            isDrawing = true;
            lastNormalizedPoint = normalized;
            upsertStroke('viewer', viewerStrokeColor, normalized, { isStart: true });
            sendAnnotationPoint(normalized, { isStart: true });
        });

        overlayCanvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const normalized = getNormalizedCoords(e);
            lastNormalizedPoint = normalized;
            upsertStroke('viewer', viewerStrokeColor, normalized);
            sendAnnotationPoint(normalized);
        });

        ['mouseup', 'mouseleave'].forEach((eventName) => {
            overlayCanvas.addEventListener(eventName, (e) => {
                isDrawing = false;
                if (lastNormalizedPoint) {
                    upsertStroke('viewer', viewerStrokeColor, lastNormalizedPoint, { isEnd: true });
                    sendAnnotationPoint(lastNormalizedPoint, { isEnd: true });
                }
                lastNormalizedPoint = null;
            });
        });

        // 서버/상대 클라이언트에서 전달된 판서 좌표 수신
        socket.on('annotation:point', (payload) => {
            console.log('[annotation] received', payload);
            const strokeKey = payload.source || 'peer';
            const strokeColor = payload.color || '#0000FF';

            const normalizedPoint = { x: payload.x, y: payload.y };
            upsertStroke(strokeKey, strokeColor, normalizedPoint, { isStart: payload.isStart, isEnd: payload.isEnd });
        });

        // 3. WebRTC Signaling 처리
        socket.on('offer', async (offer) => {
            createPeerConnection();
            await peerConnection.setRemoteDescription(offer);
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('answer', answer);
        });

        socket.on('ice-candidate', (candidate) => {
            if (peerConnection) {
                peerConnection.addIceCandidate(candidate);
            }
        });

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(rtcConfig);

            // 상대방의 영상 트랙 수신 시 비디오 태그에 연결
            peerConnection.ontrack = (event) => {
                remoteVideo.srcObject = event.streams[0];
                remoteVideo.onloadedmetadata = () => {
                    resizeRenderCanvas();
                    renderRemoteVideo();
                };
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', event.candidate);
                }
            };
        }
    </script>
</body>
</html>
