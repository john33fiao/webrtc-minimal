<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Server (Viewer)</title>
    <style>
        :root {
            --bg: #0b1021;
            --frame: #0f172a;
            --border: #1e293b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: white;
        }

        /* 16:9 비율을 유지하며 뷰포트 크기에 맞춰 레터/필러박스 처리 */
        #video-container {
            position: relative;
            width: min(100vw, calc(100vh * 16 / 9));
            height: min(100vh, calc(100vw * 9 / 16));
            background: var(--frame);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
            cursor: crosshair;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: black;
        }

        #annotationCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: auto;
            cursor: crosshair;
            touch-action: none;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div id="video-container">
        <video id="remoteVideo" autoplay playsinline></video>
        <canvas id="annotationCanvas"></canvas>
    </div>

    <!-- <script src="/socket.io/socket.io.js"></script> -->
    <script src="socket.io.min.js"></script>
    <script>
        const socket = io();
        const remoteVideo = document.getElementById('remoteVideo');
        const videoContainer = document.getElementById('video-container');
        let peerConnection;
        let isDrawing = false;
        let lastPoint = null;
        const remoteStrokeState = new Map();
        const viewerStrokeColor = '#0000FF';

        const overlayCanvas = document.getElementById('annotationCanvas');
        const overlayCtx = overlayCanvas.getContext('2d');

        function resizeCanvas() {
            const rect = videoContainer.getBoundingClientRect();
            overlayCanvas.width = rect.width;
            overlayCanvas.height = rect.height;
            overlayCtx.strokeStyle = viewerStrokeColor;
            overlayCtx.lineWidth = 3;
            overlayCtx.lineCap = 'round';
            overlayCtx.lineJoin = 'round';
        }

        function getNormalizedCoords(event) {
            const rect = overlayCanvas.getBoundingClientRect();
            const x = (event.clientX - rect.left) / rect.width;
            const y = (event.clientY - rect.top) / rect.height;
            return {
                x: Number(x.toFixed(4)),
                y: Number(y.toFixed(4)),
            };
        }

        function denormalizeCoords({ x, y }) {
            return {
                x: x * overlayCanvas.width,
                y: y * overlayCanvas.height,
            };
        }

        function drawStrokeSegment(from, to) {
            overlayCtx.beginPath();
            overlayCtx.moveTo(from.x, from.y);
            overlayCtx.lineTo(to.x, to.y);
            overlayCtx.stroke();
        }

        function drawPoint(point) {
            overlayCtx.beginPath();
            overlayCtx.arc(point.x, point.y, 2, 0, Math.PI * 2);
            overlayCtx.fillStyle = overlayCtx.strokeStyle;
            overlayCtx.fill();
        }

        function sendAnnotationPoint(normalized, isStart = false) {
            const payload = {
                x: normalized.x,
                y: normalized.y,
                source: 'viewer',
                createdAt: Date.now(),
                kind: 'annotation-point',
                isStart,
                color: viewerStrokeColor,
            };
            socket.emit('annotation:point', payload);
            console.log('[annotation] sent', payload);
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function requestStartCamera() {
            console.log('Requesting camera start...');
            socket.emit('request_start_camera');
        }

        // WebRTC 설정: 로컬망 환경만 사용하므로 외부 STUN 서버 없이 구성
        const rtcConfig = {
            iceServers: []
        };

        // 1. 영상 영역 클릭 시 촬영 시작 요청
        videoContainer.addEventListener('click', requestStartCamera, { capture: true });

        // 2. 마우스 입력 (드래그/클릭) 좌표 전송 및 로컬 렌더링
        // 영상 내부에서의 상대 좌표(0.0 ~ 1.0)로 변환하여 전송해야 해상도가 달라도 정확함
        overlayCanvas.addEventListener('mousedown', (e) => {
            requestStartCamera();
            const normalized = getNormalizedCoords(e);
            const canvasPoint = denormalizeCoords(normalized);
            isDrawing = true;
            lastPoint = canvasPoint;
            drawPoint(canvasPoint);
            sendAnnotationPoint(normalized, true);
        });

        overlayCanvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const normalized = getNormalizedCoords(e);
            const canvasPoint = denormalizeCoords(normalized);
            drawStrokeSegment(lastPoint, canvasPoint);
            lastPoint = canvasPoint;
            sendAnnotationPoint(normalized);
        });

        ['mouseup', 'mouseleave'].forEach((eventName) => {
            overlayCanvas.addEventListener(eventName, () => {
                isDrawing = false;
                lastPoint = null;
            });
        });

        // 서버/상대 클라이언트에서 전달된 판서 좌표 수신
        socket.on('annotation:point', (payload) => {
            console.log('[annotation] received', payload);
            const canvasPoint = denormalizeCoords(payload);
            const strokeKey = payload.source || 'peer';
            const strokeColor = payload.color || '#0000FF';

            if (payload.isStart) {
                remoteStrokeState.delete(strokeKey);
            }
            const previousPoint = remoteStrokeState.get(strokeKey);

            overlayCtx.save();
            overlayCtx.strokeStyle = strokeColor;
            overlayCtx.fillStyle = strokeColor;

            if (previousPoint && !payload.isStart) {
                drawStrokeSegment(previousPoint.point, canvasPoint);
            } else {
                drawPoint(canvasPoint);
            }

            overlayCtx.restore();
            remoteStrokeState.set(strokeKey, { point: canvasPoint, color: strokeColor });
        });

        // 3. WebRTC Signaling 처리
        socket.on('offer', async (offer) => {
            createPeerConnection();
            await peerConnection.setRemoteDescription(offer);
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('answer', answer);
        });

        socket.on('ice-candidate', (candidate) => {
            if (peerConnection) {
                peerConnection.addIceCandidate(candidate);
            }
        });

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(rtcConfig);

            // 상대방의 영상 트랙 수신 시 비디오 태그에 연결
            peerConnection.ontrack = (event) => {
                remoteVideo.srcObject = event.streams[0];
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', event.candidate);
                }
            };
        }
    </script>
</body>
</html>
