<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Client (Camera)</title>
    <style>
        :root {
            --bg: #0b1021;
            --panel: #11162b;
            --accent: #5eead4;
            --text: #e2e8f0;
            --muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Inter', 'Noto Sans KR', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 20% 20%, rgba(94, 234, 212, 0.08), transparent 35%),
                        radial-gradient(circle at 80% 0%, rgba(94, 234, 212, 0.05), transparent 30%),
                        var(--bg);
            color: var(--text);
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            backdrop-filter: blur(8px);
        }

        .title {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .title h1 {
            margin: 0;
            font-size: 20px;
            letter-spacing: -0.2px;
        }

        .title .subtitle {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
        }

        .status-badges {
            display: flex;
            gap: 8px;
        }

        .badge {
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 12px;
            letter-spacing: 0.1px;
            background: rgba(94, 234, 212, 0.1);
            color: var(--accent);
            border: 1px solid rgba(94, 234, 212, 0.25);
        }

        .workspace {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: 16px;
            padding: 16px 20px 20px;
            height: calc(100vh - 80px);
        }

        .stage {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0));
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
        }

        .stage-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--muted);
            font-size: 13px;
        }

        .video-shell {
            position: relative;
            flex: 1;
            border-radius: 12px;
            overflow: hidden;
            background: #0d1326;
            border: 1px solid rgba(255, 255, 255, 0.08);
            min-height: 320px;
        }

        #localVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            background: #0d1326;
        }

        #drawCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .overlay-hint {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            color: rgba(255, 255, 255, 0.35);
            font-size: 15px;
            letter-spacing: 0.2px;
            background: radial-gradient(circle at 50% 50%, rgba(94, 234, 212, 0.04), transparent 35%);
        }

        .overlay-controls {
            position: absolute;
            left: 12px;
            bottom: 12px;
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 10px 12px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .pill-button {
            border-radius: 999px;
            padding: 10px 14px;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(34, 211, 238, 0.25);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(94, 234, 212, 0.5);
        }

        .pill-button.active {
            background: linear-gradient(135deg, #22d3ee, #0ea5e9);
            color: #0b1021;
            box-shadow: 0 12px 30px rgba(14, 165, 233, 0.35);
        }

        .palette {
            display: flex;
            gap: 8px;
        }

        .palette button {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            border: 2px solid transparent;
            padding: 0;
            box-shadow: none;
            transition: transform 0.1s ease, border-color 0.15s ease;
        }

        .palette button:hover {
            transform: translateY(-1px);
        }

        .palette button.active {
            border-color: #fff;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.15);
        }

        .side-panel {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            min-height: 0;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            padding: 12px 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #5eead4, #22d3ee);
            color: #0b1021;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            box-shadow: 0 10px 25px rgba(34, 211, 238, 0.25);
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 30px rgba(34, 211, 238, 0.3);
        }

        button:active {
            transform: translateY(0);
            box-shadow: 0 8px 18px rgba(34, 211, 238, 0.18);
        }

        .notice {
            background: rgba(94, 234, 212, 0.08);
            border: 1px solid rgba(94, 234, 212, 0.2);
            border-radius: 12px;
            padding: 12px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }

        #log {
            flex: 1;
            background: #0c1328;
            border-radius: 10px;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 12px;
            line-height: 1.6;
            overflow-y: auto;
            white-space: pre-line;
        }

        .log-title {
            color: var(--muted);
            font-size: 13px;
            margin: 0;
        }

        @media (max-width: 980px) {
            .workspace {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <div class="title">
                <h1>근무자 송출 화면</h1>
                <p class="subtitle">판서 중심 레이아웃으로 영상 영역을 최대 확보했습니다.</p>
            </div>
            <div class="status-badges">
                <span class="badge">WebRTC 대기</span>
                <span class="badge">판서 오버레이 준비</span>
            </div>
        </header>

        <main class="workspace">
            <section class="stage">
                <div class="stage-header">
                    <span>송출 미리보기 / 판서 레이어</span>
                    <span>미러 모드</span>
                </div>
                <div class="video-shell">
                    <video id="localVideo" autoplay playsinline muted></video>
                    <canvas id="drawCanvas"></canvas>
                    <div class="overlay-hint">영상 위에 판서 레이어가 자리합니다</div>
                    <div class="overlay-controls">
                        <button id="btnToggleDraw" class="pill-button">✏️ 판서 시작</button>
                        <div class="palette" aria-label="색상 팔레트">
                            <button class="palette-color" data-color="#5eead4" style="background:#5eead4" aria-label="민트"></button>
                            <button class="palette-color" data-color="#f97316" style="background:#f97316" aria-label="오렌지"></button>
                            <button class="palette-color" data-color="#22d3ee" style="background:#22d3ee" aria-label="시안"></button>
                            <button class="palette-color" data-color="#a855f7" style="background:#a855f7" aria-label="퍼플"></button>
                        </div>
                    </div>
                </div>
            </section>

            <aside class="side-panel">
                <div class="controls">
                    <button id="btnLocalStart">내 촬영 시작 (수동)</button>
                    <div class="notice">
                        • 서버의 촬영 요청을 기다리거나 직접 시작할 수 있습니다.<br>
                        • 판서 도구가 활성화되면 이 영상 위에 그대로 덧칠됩니다.
                    </div>
                </div>
                <div>
                    <p class="log-title">상태 로그</p>
                    <div id="log"></div>
                </div>
            </aside>
        </main>
    </div>

    <!-- <script src="/socket.io/socket.io.js"></script> -->
    <script src="socket.io.min.js"></script>
    <script>
        // 명시적으로 서버 주소를 적지 않으면 현재 접속한 주소(192.168.x.x:3000)를 기준으로 연결합니다.
        const socket = io();
        const localVideo = document.getElementById('localVideo');
        const logDiv = document.getElementById('log');
        const drawCanvas = document.getElementById('drawCanvas');
        const videoShell = document.querySelector('.video-shell');
        const overlayHint = document.querySelector('.overlay-hint');
        const toggleDrawBtn = document.getElementById('btnToggleDraw');
        const paletteButtons = Array.from(document.querySelectorAll('.palette-color'));
        const drawCtx = drawCanvas.getContext('2d');
        let peerConnection;
        let cameraStream;
        let outboundStream;
        let compositeCanvas;
        let compositeCtx;
        let compositeAnimationId;
        let isDrawing = false;
        let isAnnotationEnabled = false;
        let currentColor = '#5eead4';
        const remoteStrokeState = new Map();

        // 로컬망 환경 전용: 외부 STUN 서버 없이 ICE 후보를 교환
        const rtcConfig = {
            iceServers: []
        };

        function getVideoResolution() {
            const track = cameraStream?.getVideoTracks()[0];
            const settings = track?.getSettings?.() || {};
            const width = settings.width || localVideo.videoWidth || 1280;
            const height = settings.height || localVideo.videoHeight || 720;
            return { width, height };
        }

        function ensureCompositeCanvas() {
            if (!compositeCanvas) {
                compositeCanvas = document.createElement('canvas');
                compositeCtx = compositeCanvas.getContext('2d');
            }

            const { width, height } = getVideoResolution();
            if (!width || !height) return;

            if (compositeCanvas.width !== width || compositeCanvas.height !== height) {
                compositeCanvas.width = width;
                compositeCanvas.height = height;
            }
        }

        function startCompositeStream() {
            ensureCompositeCanvas();

            const drawFrame = () => {
                const { width, height } = getVideoResolution();
                if (!width || !height) {
                    compositeAnimationId = requestAnimationFrame(drawFrame);
                    return;
                }

                if (compositeCanvas.width !== width || compositeCanvas.height !== height) {
                    compositeCanvas.width = width;
                    compositeCanvas.height = height;
                }

                compositeCtx.clearRect(0, 0, compositeCanvas.width, compositeCanvas.height);
                compositeCtx.drawImage(localVideo, 0, 0, compositeCanvas.width, compositeCanvas.height);
                compositeCtx.drawImage(drawCanvas, 0, 0, compositeCanvas.width, compositeCanvas.height);
                compositeAnimationId = requestAnimationFrame(drawFrame);
            };

            if (compositeAnimationId) cancelAnimationFrame(compositeAnimationId);
            if (!outboundStream) {
                outboundStream = compositeCanvas.captureStream(30);
            }
            drawFrame();
            return outboundStream;
        }

        function waitForVideoReady(videoEl) {
            if (videoEl.readyState >= 2 && videoEl.videoWidth && videoEl.videoHeight) return Promise.resolve();
            return new Promise((resolve) => {
                const handleLoaded = () => {
                    videoEl.removeEventListener('loadedmetadata', handleLoaded);
                    resolve();
                };
                videoEl.addEventListener('loadedmetadata', handleLoaded);
            });
        }

        function resizeCanvas() {
            const rect = videoShell.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            drawCanvas.width = rect.width * dpr;
            drawCanvas.height = rect.height * dpr;
            drawCanvas.style.width = `${rect.width}px`;
            drawCanvas.style.height = `${rect.height}px`;

            drawCtx.setTransform(1, 0, 0, 1, 0, 0);
            drawCtx.scale(dpr, dpr);
            drawCtx.lineCap = 'round';
            drawCtx.lineJoin = 'round';
            drawCtx.strokeStyle = currentColor;
            drawCtx.lineWidth = 3;
        }

        function getCanvasPos(evt) {
            const rect = drawCanvas.getBoundingClientRect();
            return {
                x: evt.clientX - rect.left,
                y: evt.clientY - rect.top
            };
        }

        function getNormalizedPos(evt) {
            const rect = drawCanvas.getBoundingClientRect();
            const x = (evt.clientX - rect.left) / rect.width;
            const y = (evt.clientY - rect.top) / rect.height;
            return {
                x: Number(x.toFixed(4)),
                y: Number(y.toFixed(4)),
            };
        }

        function denormalizePos({ x, y }) {
            const rect = drawCanvas.getBoundingClientRect();
            return {
                x: x * rect.width,
                y: y * rect.height,
            };
        }

        function startDrawing(evt) {
            if (!isAnnotationEnabled) return;
            evt.preventDefault();
            isDrawing = true;
            const pos = getCanvasPos(evt);
            const normalized = getNormalizedPos(evt);
            drawCtx.beginPath();
            drawCtx.moveTo(pos.x, pos.y);
            sendAnnotationPoint(normalized.x, normalized.y);
        }

        function draw(evt) {
            if (!isDrawing) return;
            evt.preventDefault();
            const pos = getCanvasPos(evt);
            drawCtx.lineTo(pos.x, pos.y);
            drawCtx.stroke();
            const normalized = getNormalizedPos(evt);
            sendAnnotationPoint(normalized.x, normalized.y);
        }

        function endDrawing() {
            if (!isDrawing) return;
            isDrawing = false;
            drawCtx.closePath();
        }

        function setDrawingColor(color) {
            currentColor = color;
            drawCtx.strokeStyle = color;
            paletteButtons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.color === color);
            });
        }

        function applyAnnotationState(enabled) {
            isAnnotationEnabled = enabled;
            drawCanvas.style.pointerEvents = enabled ? 'auto' : 'none';
            toggleDrawBtn.classList.toggle('active', enabled);
            toggleDrawBtn.textContent = enabled ? '✏️ 판서 종료' : '✏️ 판서 시작';
            overlayHint.textContent = enabled ? '판서 모드 활성화됨' : '판서 대기 상태';
        }

        function toggleAnnotation() {
            applyAnnotationState(!isAnnotationEnabled);
        }

        resizeCanvas();
        setDrawingColor(currentColor);
        applyAnnotationState(false);
        window.addEventListener('resize', resizeCanvas);

        drawCanvas.addEventListener('pointerdown', startDrawing);
        drawCanvas.addEventListener('pointermove', draw);
        drawCanvas.addEventListener('pointerup', endDrawing);
        drawCanvas.addEventListener('pointerleave', endDrawing);
        drawCanvas.addEventListener('pointercancel', endDrawing);

        toggleDrawBtn.addEventListener('click', toggleAnnotation);
        paletteButtons.forEach(btn => {
            btn.addEventListener('click', () => setDrawingColor(btn.dataset.color));
        });

        // [중요] 디버깅을 위한 로그 함수
        function log(msg) {
            const time = new Date().toLocaleTimeString();
            logDiv.innerHTML = `[${time}] ${msg}<br>` + logDiv.innerHTML;
        }

        // 1. 서버 연결 확인 이벤트
        socket.on('connect', () => {
            log(`✅ 서버에 연결되었습니다! (ID: ${socket.id})`);
            log('촬영 요청 대기 중...');
        });

        socket.on('disconnect', () => {
            log('❌ 서버와 연결이 끊어졌습니다.');
        });

        socket.on('connect_error', (err) => {
            log(`⚠️ 연결 오류: ${err.message}`);
        });

        // 2. 촬영 시작 명령 수신
        socket.on('cmd_start_camera', () => {
            log('📩 서버로부터 촬영 요청 수신!');
            startStreaming();
        });

        // 판서 좌표 송수신: RTCDataChannel 없이 Socket.IO 채널을 재사용
        function sendAnnotationPoint(x, y) {
            const payload = {
                x: x,
                y: y,
                source: 'camera',
                createdAt: Date.now(),
                kind: 'annotation-point',
            };
            socket.emit('annotation:point', payload);
            log(`✏️ 판서 좌표 전송: ${payload.x}, ${payload.y}`);
        }

        socket.on('annotation:point', (payload) => {
            log(`🖌️ 판서 좌표 수신: ${payload.x}, ${payload.y} (from ${payload.source})`);
            const canvasPoint = denormalizePos(payload);
            const strokeKey = payload.source || 'peer';
            const previousPoint = remoteStrokeState.get(strokeKey);

            drawCtx.save();
            drawCtx.globalAlpha = 0.85;
            drawCtx.strokeStyle = '#0000FF';
            drawCtx.fillStyle = '#0000FF';

            if (previousPoint) {
                drawCtx.beginPath();
                drawCtx.moveTo(previousPoint.x, previousPoint.y);
                drawCtx.lineTo(canvasPoint.x, canvasPoint.y);
                drawCtx.stroke();
            } else {
                drawCtx.beginPath();
                drawCtx.arc(canvasPoint.x, canvasPoint.y, 2, 0, Math.PI * 2);
                drawCtx.fill();
            }

            drawCtx.restore();
            remoteStrokeState.set(strokeKey, canvasPoint);
        });

        // ... (나머지 WebRTC 관련 코드는 기존과 동일, startStreaming 함수 등) ...

        async function startStreaming() {
            if (outboundStream) return;
            try {
                log('📷 카메라 권한 요청 중...');
                // 모든 카메라 장치 사용 (OBS 가상 카메라 포함)
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                localVideo.srcObject = cameraStream;
                await waitForVideoReady(localVideo);
                log('🎥 스트림 획득 성공! WebRTC 연결 시작...');

                const mixedStream = startCompositeStream();
                createPeerConnection();
                mixedStream.getTracks().forEach(track => peerConnection.addTrack(track, mixedStream));

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('offer', offer);
                log('📡 Offer 전송 완료');

            } catch (err) {
                console.error(err);
                log(`❌ 카메라 실패: ${err.name} - ${err.message}`);

                // 카메라 권한 없으면 더미 화면 송출
                log('💡 더미 화면을 생성하여 송출합니다...');
                createDummyStream();
            }
        }

        // 더미 canvas 스트림 생성
        function createDummyStream() {
            const canvas = document.createElement('canvas');
            canvas.width = 1280;
            canvas.height = 720;
            const ctx = canvas.getContext('2d');

            // 배경 색상
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 텍스트 그리기
            ctx.fillStyle = '#ff0000';
            ctx.font = 'bold 60px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('카메라 권한이 없습니다', canvas.width / 2, canvas.height / 2 - 60);

            ctx.fillStyle = '#ffffff';
            ctx.font = '30px Arial';
            ctx.fillText('(Dummy Stream)', canvas.width / 2, canvas.height / 2 + 60);

            // canvas를 스트림으로 변환
            outboundStream = canvas.captureStream(30); // 30 FPS
            localVideo.srcObject = outboundStream;

            createPeerConnection();
            outboundStream.getTracks().forEach(track => peerConnection.addTrack(track, outboundStream));

            const offer = peerConnection.createOffer();
            offer.then(off => {
                peerConnection.setLocalDescription(off);
                socket.emit('offer', off);
                log('📡 Offer 전송 완료 (Dummy Stream)');
            });
        }

        // ... (createPeerConnection 등 머지 함수 그대로) ...

        // (누락 방지를 위해 필수 함수 다시 기재)
        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(rtcConfig);
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) socket.emit('ice-candidate', event.candidate);
            };
        }
        socket.on('answer', (ans) => peerConnection.setRemoteDescription(ans));
        socket.on('ice-candidate', (can) => peerConnection && peerConnection.addIceCandidate(can));

        // 수동 시작 버튼 클릭
        document.getElementById('btnLocalStart').addEventListener('click', () => {
            startStreaming();
        });
    </script>
</body>
</html>
