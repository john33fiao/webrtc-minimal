<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Client (Camera)</title>
    <meta name="theme-color" content="#0b1021">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg: #0b1021;
            --frame: #0f172a;
            --border: #1e293b;
            --accent: #5eead4;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 20% 20%, rgba(94, 234, 212, 0.08), transparent 35%),
                        radial-gradient(circle at 80% 0%, rgba(94, 234, 212, 0.05), transparent 30%),
                        var(--bg);
            color: #e2e8f0;
            font-family: 'Inter', 'Noto Sans KR', system-ui, -apple-system, sans-serif;
            padding: 16px;
        }

        /* 16:9 비율을 유지하며 뷰포트를 채우되 레터/필러박스 처리 */
        #videoContainer {
            position: relative;
            width: min(100vw - 32px, calc((100vh - 32px) * 16 / 9));
            height: min(100vh - 32px, calc((100vw - 32px) * 9 / 16));
            background: var(--frame);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
            overflow: hidden;
            cursor: pointer;
        }

        #videoContainer.streaming::after {
            display: none;
        }

        #videoContainer::after {
            content: '영상 화면을 클릭하면 촬영이 시작됩니다';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(226, 232, 240, 0.6);
            font-size: 15px;
            pointer-events: none;
            text-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: black;
        }

        #drawCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: crosshair;
        }
    </style>
</head>
<body>
    <div id="videoContainer">
        <video id="localVideo" autoplay playsinline muted></video>
        <canvas id="drawCanvas"></canvas>
    </div>

    <!-- <script src="/socket.io/socket.io.js"></script> -->
    <script src="socket.io.min.js"></script>
    <script>
        const socket = io();
        const localVideo = document.getElementById('localVideo');
        const drawCanvas = document.getElementById('drawCanvas');
        const videoContainer = document.getElementById('videoContainer');
        const drawCtx = drawCanvas.getContext('2d');

        const TARGET_WIDTH = 1920;
        const TARGET_HEIGHT = 1080;

        let peerConnection;
        let cameraStream;
        let isDrawing = false;
        let currentColor = '#5eead4';
        let lastNormalizedPoint = null;
        let isStreaming = false;
        let isStarting = false;
        const STROKE_LIFETIME_MS = 10_000;
        const strokes = [];
        const activeStrokes = new Map();

        // 로컬망 환경 전용: 외부 STUN 서버 없이 ICE 후보를 교환
        const rtcConfig = {
            iceServers: []
        };

        function log(message) {
            console.log(message);
        }

        function waitForVideoReady(videoEl) {
            if (videoEl.readyState >= 2 && videoEl.videoWidth && videoEl.videoHeight) return Promise.resolve();
            return new Promise((resolve) => {
                const handleLoaded = () => {
                    videoEl.removeEventListener('loadedmetadata', handleLoaded);
                    resolve();
                };
                videoEl.addEventListener('loadedmetadata', handleLoaded);
            });
        }

        function resizeCanvas() {
            const rect = videoContainer.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            drawCanvas.width = rect.width * dpr;
            drawCanvas.height = rect.height * dpr;
            drawCanvas.style.width = `${rect.width}px`;
            drawCanvas.style.height = `${rect.height}px`;

            drawCtx.setTransform(1, 0, 0, 1, 0, 0);
            drawCtx.scale(dpr, dpr);
            drawCtx.lineCap = 'round';
            drawCtx.lineJoin = 'round';
            drawCtx.strokeStyle = currentColor;
            drawCtx.lineWidth = 3;
            renderAllStrokes();
        }

        function getNormalizedPos(evt) {
            const rect = drawCanvas.getBoundingClientRect();
            const x = (evt.clientX - rect.left) / rect.width;
            const y = (evt.clientY - rect.top) / rect.height;
            return {
                x: Number(x.toFixed(4)),
                y: Number(y.toFixed(4)),
            };
        }

        function drawPoint(point, ctx) {
            ctx.beginPath();
            ctx.arc(point.x, point.y, 2, 0, Math.PI * 2);
            ctx.fillStyle = ctx.strokeStyle;
            ctx.fill();
        }

        function renderAllStrokes() {
            const rect = drawCanvas.getBoundingClientRect();
            const toCanvasPoint = (p) => ({
                x: p.x * rect.width,
                y: p.y * rect.height,
            });

            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            strokes.forEach((stroke) => {
                if (!stroke.points.length) return;
                drawCtx.save();
                drawCtx.globalAlpha = stroke.isRemote ? 0.85 : 1;
                drawCtx.strokeStyle = stroke.color;
                drawCtx.fillStyle = stroke.color;
                drawCtx.lineWidth = 3;
                drawCtx.lineCap = 'round';
                drawCtx.lineJoin = 'round';

                if (stroke.points.length === 1) {
                    drawPoint(toCanvasPoint(stroke.points[0]), drawCtx);
                } else {
                    drawCtx.beginPath();
                    const startPoint = toCanvasPoint(stroke.points[0]);
                    drawCtx.moveTo(startPoint.x, startPoint.y);
                    for (let i = 1; i < stroke.points.length; i++) {
                        const canvasPoint = toCanvasPoint(stroke.points[i]);
                        drawCtx.lineTo(canvasPoint.x, canvasPoint.y);
                    }
                    drawCtx.stroke();
                }
                drawCtx.restore();
            });
        }

        function scheduleStrokeExpiry(stroke) {
            if (stroke.expireTimer) clearTimeout(stroke.expireTimer);
            stroke.expireTimer = setTimeout(() => {
                const idx = strokes.indexOf(stroke);
                if (idx !== -1) {
                    strokes.splice(idx, 1);
                    renderAllStrokes();
                }
            }, STROKE_LIFETIME_MS);
        }

        function finalizeStroke(strokeKey) {
            const stroke = activeStrokes.get(strokeKey);
            if (!stroke) return;
            activeStrokes.delete(strokeKey);
            scheduleStrokeExpiry(stroke);
        }

        function upsertStroke(strokeKey, strokeColor, normalizedPoint, { isStart = false, isEnd = false, isRemote = false } = {}) {
            if (isStart) {
                finalizeStroke(strokeKey);
            }

            let stroke = activeStrokes.get(strokeKey);
            if (!stroke || isStart) {
                stroke = { key: strokeKey, color: strokeColor, points: [], expireTimer: null, isRemote };
                strokes.push(stroke);
                activeStrokes.set(strokeKey, stroke);
            }

            stroke.points.push(normalizedPoint);

            if (isEnd) {
                finalizeStroke(strokeKey);
            }

            renderAllStrokes();
        }

        function startDrawing(evt) {
            evt.preventDefault();
            isDrawing = true;
            const normalized = getNormalizedPos(evt);
            lastNormalizedPoint = normalized;
            upsertStroke('camera', currentColor, normalized, { isStart: true });
            sendAnnotationPoint(normalized.x, normalized.y, true);
        }

        function draw(evt) {
            if (!isDrawing) return;
            evt.preventDefault();
            const normalized = getNormalizedPos(evt);
            lastNormalizedPoint = normalized;
            upsertStroke('camera', currentColor, normalized);
            sendAnnotationPoint(normalized.x, normalized.y);
        }

        function endDrawing(evt) {
            if (!isDrawing) return;
            isDrawing = false;
            const normalized = evt ? getNormalizedPos(evt) : lastNormalizedPoint;
            if (normalized) {
                upsertStroke('camera', currentColor, normalized, { isEnd: true });
                sendAnnotationPoint(normalized.x, normalized.y, false, true);
            }
            lastNormalizedPoint = null;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        drawCanvas.addEventListener('pointerdown', startDrawing);
        drawCanvas.addEventListener('pointermove', draw);
        drawCanvas.addEventListener('pointerup', endDrawing);
        drawCanvas.addEventListener('pointerleave', endDrawing);
        drawCanvas.addEventListener('pointercancel', endDrawing);

        // 1. 서버 연결 확인 이벤트
        socket.on('connect', () => {
            log(`✅ 서버에 연결되었습니다! (ID: ${socket.id})`);
            log('촬영 요청 대기 중...');
        });

        socket.on('disconnect', () => {
            log('❌ 서버와 연결이 끊어졌습니다.');
        });

        socket.on('connect_error', (err) => {
            log(`⚠️ 연결 오류: ${err.message}`);
        });

        // 2. 촬영 시작 명령 수신
        socket.on('cmd_start_camera', () => {
            log('📩 서버로부터 촬영 요청 수신!');
            startStreaming();
        });

        // 판서 좌표 송수신: RTCDataChannel 없이 Socket.IO 채널을 재사용
        function sendAnnotationPoint(x, y, isStart = false, isEnd = false) {
            const payload = {
                x: x,
                y: y,
                source: 'camera',
                createdAt: Date.now(),
                kind: 'annotation-point',
                isStart,
                isEnd,
                color: currentColor,
            };
            socket.emit('annotation:point', payload);
            log(`✏️ 판서 좌표 전송: ${payload.x}, ${payload.y}`);
        }

        socket.on('annotation:point', (payload) => {
            log(`🖌️ 판서 좌표 수신: ${payload.x}, ${payload.y} (from ${payload.source})`);
            const strokeKey = payload.source || 'peer';
            const strokeColor = payload.color || '#0000FF';

            const normalizedPoint = { x: payload.x, y: payload.y };
            upsertStroke(strokeKey, strokeColor, normalizedPoint, {
                isStart: payload.isStart,
                isEnd: payload.isEnd,
                isRemote: true,
            });
        });

        function createPeerConnection() {
            if (peerConnection) {
                try {
                    peerConnection.onicecandidate = null;
                    peerConnection.close();
                } catch (e) {
                    console.warn('기존 PeerConnection 정리 중 경고', e);
                }
            }

            peerConnection = new RTCPeerConnection(rtcConfig);
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) socket.emit('ice-candidate', event.candidate);
            };
        }

        async function negotiateWithStream(stream) {
            if (!stream) return;

            createPeerConnection();
            stream.getTracks().forEach((track) => {
                const sender = peerConnection.addTrack(track, stream);
                if (track.kind === 'video') {
                    const params = sender.getParameters();
                    params.encodings = params.encodings || [{}];
                    params.encodings[0].maxBitrate = 8_000_000; // 영상 스트림만 송출하므로 넉넉히 확보
                    params.encodings[0].maxFramerate = 30;
                    sender.setParameters(params);
                }
            });

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit('offer', offer);
            log('📡 Offer 전송 완료');
        }

        async function startStreaming() {
            if (isStreaming || isStarting) {
                log('⏯️ 이미 스트리밍 중이거나 시작 대기 상태입니다. 중복 요청을 무시합니다.');
                return;
            }

            isStarting = true;
            videoContainer.classList.add('streaming');
            try {
                if (!cameraStream) {
                    log('📷 카메라 권한 요청 중...');
                    cameraStream = await navigator.mediaDevices.getUserMedia({
                        video: { width: { ideal: TARGET_WIDTH }, height: { ideal: TARGET_HEIGHT }, aspectRatio: 16 / 9 },
                        audio: false
                    });
                    localVideo.srcObject = cameraStream;
                    await waitForVideoReady(localVideo);
                    log('🎥 스트림 획득 성공! WebRTC 연결 시작...');
                }

                // 판서 오버레이는 각 측에서 별도 캔버스로 렌더링하며, 영상 스트림에 합성하지 않습니다.
                await negotiateWithStream(cameraStream);
                isStreaming = true;
                log('✅ 스트리밍을 시작했습니다.');

            } catch (err) {
                console.error(err);
                log(`❌ 카메라 실패: ${err.name} - ${err.message}`);

                log('💡 더미 화면을 생성하여 송출합니다...');
                await createDummyStream();
            } finally {
                isStarting = false;
            }
        }

        // 더미 canvas 스트림 생성
        async function createDummyStream() {
            const canvas = document.createElement('canvas');
            canvas.width = TARGET_WIDTH;
            canvas.height = TARGET_HEIGHT;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ff0000';
            ctx.font = 'bold 60px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('카메라 권한이 없습니다', canvas.width / 2, canvas.height / 2 - 60);

            ctx.fillStyle = '#ffffff';
            ctx.font = '30px Arial';
            ctx.fillText('(Dummy Stream)', canvas.width / 2, canvas.height / 2 + 60);

            cameraStream = canvas.captureStream(30);
            localVideo.srcObject = cameraStream;
            await negotiateWithStream(cameraStream);
            isStreaming = true;
            log('📡 Offer 전송 완료 (Dummy Stream)');
        }

        socket.on('answer', (ans) => peerConnection && peerConnection.setRemoteDescription(ans));
        socket.on('ice-candidate', (can) => peerConnection && peerConnection.addIceCandidate(can));

        // 영상 영역 클릭 시 촬영 시작
        videoContainer.addEventListener('click', () => {
            startStreaming();
        });
    </script>
</body>
</html>
