<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Client (Camera)</title>
    <style>
        :root {
            --bg: #0b1021;
            --frame: #0f172a;
            --border: #1e293b;
            --accent: #5eead4;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 20% 20%, rgba(94, 234, 212, 0.08), transparent 35%),
                        radial-gradient(circle at 80% 0%, rgba(94, 234, 212, 0.05), transparent 30%),
                        var(--bg);
            color: #e2e8f0;
            font-family: 'Inter', 'Noto Sans KR', system-ui, -apple-system, sans-serif;
            padding: 16px;
        }

        /* 16:9 비율을 유지하며 뷰포트를 채우되 레터/필러박스 처리 */
        #videoContainer {
            position: relative;
            width: min(100vw - 32px, calc((100vh - 32px) * 16 / 9));
            height: min(100vh - 32px, calc((100vw - 32px) * 9 / 16));
            background: var(--frame);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
            overflow: hidden;
            cursor: pointer;
        }

        #videoContainer.streaming::after {
            display: none;
        }

        #videoContainer::after {
            content: '영상 화면을 클릭하면 촬영이 시작됩니다';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(226, 232, 240, 0.6);
            font-size: 15px;
            pointer-events: none;
            text-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: black;
        }

        #drawCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: crosshair;
        }
    </style>
</head>
<body>
    <div id="videoContainer">
        <video id="localVideo" autoplay playsinline muted></video>
        <canvas id="drawCanvas"></canvas>
    </div>

    <!-- <script src="/socket.io/socket.io.js"></script> -->
    <script src="socket.io.min.js"></script>
    <script>
        const socket = io();
        const localVideo = document.getElementById('localVideo');
        const drawCanvas = document.getElementById('drawCanvas');
        const videoContainer = document.getElementById('videoContainer');
        const drawCtx = drawCanvas.getContext('2d');

        const STROKE_LIFETIME = 10_000;
        let peerConnection;
        let cameraStream;
        let outboundStream;
        let compositeCanvas;
        let compositeCtx;
        let compositeAnimationId;
        let isDrawing = false;
        let currentColor = '#5eead4';
        let lastNormalizedPoint = null;
        const strokeList = [];
        const activeStrokes = new Map();
        let cleanupIntervalId = null;

        // 로컬망 환경 전용: 외부 STUN 서버 없이 ICE 후보를 교환
        const rtcConfig = {
            iceServers: []
        };

        function log(message) {
            console.log(message);
        }

        function getVideoResolution() {
            const track = cameraStream?.getVideoTracks()[0];
            const settings = track?.getSettings?.() || {};
            const width = settings.width || localVideo.videoWidth || 1280;
            const height = settings.height || localVideo.videoHeight || 720;
            return { width, height };
        }

        function ensureCompositeCanvas() {
            if (!compositeCanvas) {
                compositeCanvas = document.createElement('canvas');
                compositeCtx = compositeCanvas.getContext('2d');
            }

            const { width, height } = getVideoResolution();
            if (!width || !height) return;

            if (compositeCanvas.width !== width || compositeCanvas.height !== height) {
                compositeCanvas.width = width;
                compositeCanvas.height = height;
            }
        }

        function startCompositeStream() {
            ensureCompositeCanvas();

            const drawFrame = () => {
                const { width, height } = getVideoResolution();
                if (!width || !height) {
                    compositeAnimationId = requestAnimationFrame(drawFrame);
                    return;
                }

                if (compositeCanvas.width !== width || compositeCanvas.height !== height) {
                    compositeCanvas.width = width;
                    compositeCanvas.height = height;
                }

                compositeCtx.clearRect(0, 0, compositeCanvas.width, compositeCanvas.height);
                compositeCtx.drawImage(localVideo, 0, 0, compositeCanvas.width, compositeCanvas.height);
                compositeCtx.drawImage(drawCanvas, 0, 0, compositeCanvas.width, compositeCanvas.height);
                compositeAnimationId = requestAnimationFrame(drawFrame);
            };

            if (compositeAnimationId) cancelAnimationFrame(compositeAnimationId);
            if (!outboundStream) {
                outboundStream = compositeCanvas.captureStream(30);
            }
            drawFrame();
            return outboundStream;
        }

        function waitForVideoReady(videoEl) {
            if (videoEl.readyState >= 2 && videoEl.videoWidth && videoEl.videoHeight) return Promise.resolve();
            return new Promise((resolve) => {
                const handleLoaded = () => {
                    videoEl.removeEventListener('loadedmetadata', handleLoaded);
                    resolve();
                };
                videoEl.addEventListener('loadedmetadata', handleLoaded);
            });
        }

        function resizeCanvas() {
            const rect = videoContainer.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            drawCanvas.width = rect.width * dpr;
            drawCanvas.height = rect.height * dpr;
            drawCanvas.style.width = `${rect.width}px`;
            drawCanvas.style.height = `${rect.height}px`;

            drawCtx.setTransform(1, 0, 0, 1, 0, 0);
            drawCtx.scale(dpr, dpr);
            drawCtx.lineCap = 'round';
            drawCtx.lineJoin = 'round';
            drawCtx.strokeStyle = currentColor;
            drawCtx.lineWidth = 3;
            redrawAllStrokes();
        }

        function getNormalizedPos(evt) {
            const rect = drawCanvas.getBoundingClientRect();
            const x = (evt.clientX - rect.left) / rect.width;
            const y = (evt.clientY - rect.top) / rect.height;
            return {
                x: Number(x.toFixed(4)),
                y: Number(y.toFixed(4)),
            };
        }

        function denormalizePos({ x, y }) {
            const rect = drawCanvas.getBoundingClientRect();
            return {
                x: x * rect.width,
                y: y * rect.height,
            };
        }

        function drawStrokeSegment(from, to, color = drawCtx.strokeStyle) {
            drawCtx.save();
            drawCtx.strokeStyle = color;
            drawCtx.beginPath();
            drawCtx.moveTo(from.x, from.y);
            drawCtx.lineTo(to.x, to.y);
            drawCtx.stroke();
            drawCtx.restore();
        }

        function drawPoint(point, color = drawCtx.strokeStyle) {
            drawCtx.save();
            drawCtx.fillStyle = color;
            drawCtx.beginPath();
            drawCtx.arc(point.x, point.y, 2, 0, Math.PI * 2);
            drawCtx.fill();
            drawCtx.restore();
        }

        function renderStroke(stroke) {
            if (!stroke.points.length) return;
            const points = stroke.points.map(denormalizePos);
            drawCtx.save();
            drawCtx.strokeStyle = stroke.color;
            drawCtx.fillStyle = stroke.color;
            drawCtx.globalAlpha = 0.85;

            if (points.length === 1) {
                drawPoint(points[0], stroke.color);
            } else {
                for (let i = 1; i < points.length; i++) {
                    drawStrokeSegment(points[i - 1], points[i], stroke.color);
                }
            }

            drawCtx.restore();
        }

        function redrawAllStrokes() {
            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            strokeList.forEach(renderStroke);
        }

        function pruneExpiredStrokes() {
            const now = Date.now();
            for (const [key, stroke] of activeStrokes.entries()) {
                if (stroke.endedAt && now - stroke.endedAt >= STROKE_LIFETIME) {
                    activeStrokes.delete(key);
                }
            }

            const remaining = strokeList.filter((stroke) => {
                if (!stroke.endedAt) return true;
                return now - stroke.endedAt < STROKE_LIFETIME;
            });

            if (remaining.length !== strokeList.length) {
                strokeList.length = 0;
                strokeList.push(...remaining);
                redrawAllStrokes();
            }
        }

        function ensureCleanupTimer() {
            if (cleanupIntervalId !== null) return;
            cleanupIntervalId = setInterval(pruneExpiredStrokes, 1000);
        }

        function createStroke(strokeKey, normalizedPoint, color) {
            const stroke = {
                key: strokeKey,
                color,
                points: [normalizedPoint],
                endedAt: null,
            };
            strokeList.push(stroke);
            activeStrokes.set(strokeKey, stroke);
            drawPoint(denormalizePos(normalizedPoint), color);
            ensureCleanupTimer();
            return stroke;
        }

        function appendStrokePoint(strokeKey, normalizedPoint, color) {
            const stroke = activeStrokes.get(strokeKey);
            if (!stroke) return createStroke(strokeKey, normalizedPoint, color);

            const prevPoint = stroke.points[stroke.points.length - 1];
            stroke.points.push(normalizedPoint);
            drawStrokeSegment(denormalizePos(prevPoint), denormalizePos(normalizedPoint), color);
            return stroke;
        }

        function finishStroke(strokeKey, endedAt = Date.now()) {
            const stroke = activeStrokes.get(strokeKey);
            if (!stroke) return;
            stroke.endedAt = endedAt;
            activeStrokes.delete(strokeKey);
        }

        function startDrawing(evt) {
            evt.preventDefault();
            isDrawing = true;
            const normalized = getNormalizedPos(evt);
            lastNormalizedPoint = normalized;
            createStroke('camera', normalized, currentColor);
            sendAnnotationPoint(normalized.x, normalized.y, true);
        }

        function draw(evt) {
            if (!isDrawing) return;
            evt.preventDefault();
            const normalized = getNormalizedPos(evt);
            appendStrokePoint('camera', normalized, currentColor);
            lastNormalizedPoint = normalized;
            sendAnnotationPoint(normalized.x, normalized.y);
        }

        function endDrawing(evt) {
            if (!isDrawing) return;
            const normalized = evt ? getNormalizedPos(evt) : lastNormalizedPoint;
            if (normalized) {
                appendStrokePoint('camera', normalized, currentColor);
                sendAnnotationPoint(normalized.x, normalized.y, false, true);
            } else if (lastNormalizedPoint) {
                sendAnnotationPoint(lastNormalizedPoint.x, lastNormalizedPoint.y, false, true);
            }
            finishStroke('camera');
            isDrawing = false;
            lastNormalizedPoint = null;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        drawCanvas.addEventListener('pointerdown', startDrawing);
        drawCanvas.addEventListener('pointermove', draw);
        drawCanvas.addEventListener('pointerup', endDrawing);
        drawCanvas.addEventListener('pointerleave', endDrawing);
        drawCanvas.addEventListener('pointercancel', endDrawing);

        // 1. 서버 연결 확인 이벤트
        socket.on('connect', () => {
            log(`✅ 서버에 연결되었습니다! (ID: ${socket.id})`);
            log('촬영 요청 대기 중...');
        });

        socket.on('disconnect', () => {
            log('❌ 서버와 연결이 끊어졌습니다.');
        });

        socket.on('connect_error', (err) => {
            log(`⚠️ 연결 오류: ${err.message}`);
        });

        // 2. 촬영 시작 명령 수신
        socket.on('cmd_start_camera', () => {
            log('📩 서버로부터 촬영 요청 수신!');
            startStreaming();
        });

        // 판서 좌표 송수신: RTCDataChannel 없이 Socket.IO 채널을 재사용
        function sendAnnotationPoint(x, y, isStart = false, isEnd = false) {
            const payload = {
                x: x,
                y: y,
                source: 'camera',
                createdAt: Date.now(),
                kind: 'annotation-point',
                isStart,
                isEnd,
                color: currentColor,
            };
            socket.emit('annotation:point', payload);
            log(`✏️ 판서 좌표 전송: ${payload.x}, ${payload.y}`);
        }

        socket.on('annotation:point', (payload) => {
            log(`🖌️ 판서 좌표 수신: ${payload.x}, ${payload.y} (from ${payload.source})`);
            const strokeKey = payload.source || 'peer';
            const strokeColor = payload.color || '#0000FF';
            const normalizedPoint = { x: payload.x, y: payload.y };

            if (payload.isStart) {
                const existing = activeStrokes.get(strokeKey);
                if (existing) {
                    existing.endedAt = payload.createdAt || Date.now();
                    activeStrokes.delete(strokeKey);
                }
                createStroke(strokeKey, normalizedPoint, strokeColor);
            } else {
                appendStrokePoint(strokeKey, normalizedPoint, strokeColor);
            }

            if (payload.isEnd) {
                const endedAt = payload.createdAt || Date.now();
                finishStroke(strokeKey, endedAt);
            }
        });

        async function startStreaming() {
            if (outboundStream) return;
            videoContainer.classList.add('streaming');
            try {
                log('📷 카메라 권한 요청 중...');
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1280 }, height: { ideal: 720 }, aspectRatio: 16 / 9 },
                    audio: false
                });
                localVideo.srcObject = cameraStream;
                await waitForVideoReady(localVideo);
                log('🎥 스트림 획득 성공! WebRTC 연결 시작...');

                const mixedStream = startCompositeStream();
                createPeerConnection();
                mixedStream.getTracks().forEach(track => peerConnection.addTrack(track, mixedStream));

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('offer', offer);
                log('📡 Offer 전송 완료');

            } catch (err) {
                console.error(err);
                log(`❌ 카메라 실패: ${err.name} - ${err.message}`);

                log('💡 더미 화면을 생성하여 송출합니다...');
                createDummyStream();
            }
        }

        // 더미 canvas 스트림 생성
        function createDummyStream() {
            const canvas = document.createElement('canvas');
            canvas.width = 1280;
            canvas.height = 720;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ff0000';
            ctx.font = 'bold 60px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('카메라 권한이 없습니다', canvas.width / 2, canvas.height / 2 - 60);

            ctx.fillStyle = '#ffffff';
            ctx.font = '30px Arial';
            ctx.fillText('(Dummy Stream)', canvas.width / 2, canvas.height / 2 + 60);

            outboundStream = canvas.captureStream(30);
            localVideo.srcObject = outboundStream;

            createPeerConnection();
            outboundStream.getTracks().forEach(track => peerConnection.addTrack(track, outboundStream));

            peerConnection.createOffer().then(off => {
                peerConnection.setLocalDescription(off);
                socket.emit('offer', off);
                log('📡 Offer 전송 완료 (Dummy Stream)');
            });
        }

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(rtcConfig);
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) socket.emit('ice-candidate', event.candidate);
            };
        }
        socket.on('answer', (ans) => peerConnection.setRemoteDescription(ans));
        socket.on('ice-candidate', (can) => peerConnection && peerConnection.addIceCandidate(can));

        // 영상 영역 클릭 시 촬영 시작
        videoContainer.addEventListener('click', () => {
            startStreaming();
        });

        ensureCleanupTimer();
    </script>
</body>
</html>
